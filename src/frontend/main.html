<!DOCTYPE Html>
<html lang="en">
    <head>
    <style>
        h1 {text-align:  center;}
        btn {text-align:  center;}
    </style>
        <meta charset = "UTF-8"/>
        <title>AirBnB Prototype Design</title>
        <script type="module" src = "entrypoint.ts"></script>
        <link rel="stylesheet" href="styling.css" />
    </head>
    <body>
        <h1 class ="header-frame"> Search for a Rental: </h1>
            <div style = "text-align: center;">
                <div class= "user-Input">
                <input type = "text" placeholder = "search here...">
                <button class="btn"> Search</button>
            </div>

        <div class = "filter-frame"> 
          <fieldset class ="check-box">
            <legend> Filter Listings:  </legend>
            <label class = "checkbox-label">
                <input type="checkbox" name="amenities" value="pool"> Pool
            </label>

            <label class = "checkbox-label">
                <input type="checkbox" name="amenities" value="garage"> Garage
            </label>

            <label class = "checkbox-label">
                <input type="checkbox" name="amenities" value="backyard"> Backyard
            </label>

            <label class = "checkbox-label">
                <input type="checkbox" name="amenities" value="lounge"> Lounge
            </label>
    
          </fieldset>
        </div>
    </body>
</html>
